name: Build College Football Dynasty APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7 & Generate Wrapper Safely
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate Gradle Wrapper Files
        run: gradle wrapper --gradle-version 8.7

      - name: Run Unit Tests (Scoring, Sim, Standings, Schedule, Saves)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK (Includes 180MB Stadium Asset Pack Task)
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK Size >= 175 MB
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK was not generated at $APK_PATH"
            exit 1
          fi
          SIZE_MB=$(du -m "$APK_PATH" | cut -f1)
          echo "Generated APK size: ${SIZE_MB} MB"
          if [ "$SIZE_MB" -lt 175 ]; then
            echo "ERROR: APK size (${SIZE_MB} MB) is under 175 MB!"
            exit 1
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CollegeFootballDynasty-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
